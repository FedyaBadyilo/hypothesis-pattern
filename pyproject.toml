[tool.poetry]
name = "llm-hypothesis-template"
version = "0.1.0"
description = "Template repository for rapid prototyping and hypothesis testing of LLM-powered agents, RAG systems, and document processing solutions"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.12.3"
langchain-openai = "^1.0.1"
langchain-qdrant = "^1.1.0"

[tool.poetry.extras]
# your extra dependencies

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
